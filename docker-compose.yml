version: '3.8'

services:
  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/code
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - POSTGRES_DB=blog
      - DB_NAME=blog
      - DB_USER=blog
      - DB_PASSWORD=blog
      - DB_HOST=db
      - DB_PORT=5432
      - DJANGO_DEBUG=True
      - DJANGO_SECRET_KEY=your-secret-key-for-local-dev

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: blog
      POSTGRES_USER: blog
      POSTGRES_PASSWORD: blog
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: