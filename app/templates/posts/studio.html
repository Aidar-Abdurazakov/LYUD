{% extends 'posts/base.html' %}
{% block content %}
<style>.studio{max-width:760px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:12px}.card{padding:18px;background:var(--surface);border:1px solid var(--border);border-radius:16px}.number{font-size:28px;font-weight:900}.label{color:var(--muted);font-size:13px}.balance{font-size:42px;font-weight:900;margin:8px 0 18px}.card button{padding:10px 16px;background:var(--accent);border:0;border-radius:10px;font-weight:800}@media(max-width:600px){.stats{grid-template-columns:1fr}}</style>
<section class="studio"><div class="stats"><div class="card"><div class="number">{{ posts_count }}</div><div class="label">Публикации</div></div><div class="card"><div class="number">{{ total_likes }}</div><div class="label">Реакции</div></div><div class="card"><div class="number">{{ total_replies }}</div><div class="label">Ответы</div></div></div><div class="card"><div class="label">Баланс</div><div class="balance">{{ creator.balance }} ₽</div><div class="label" style="margin-bottom:15px">{% if creator.monetization_enabled %}Монетизация включена{% else %}Монетизация выключена{% endif %}</div><form method="post" action="{% url 'toggle_monetization' %}">{% csrf_token %}<button>{% if creator.monetization_enabled %}Выключить{% else %}Включить{% endif %}</button></form></div></section>
{% endblock %}
