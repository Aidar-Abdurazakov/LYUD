{% extends 'posts/base.html' %}

{% block content %}
<div class="reels-container" style="max-width: 420px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; padding-bottom: 20px;">
    {% for post in posts %}
        <div class="reel-card" style="position: relative; width: 100%; height: 75vh; max-height: 700px; background: #000; border-radius: 16px; overflow: hidden; border: 1px solid var(--border-color); box-shadow: 0 4px 20px rgba(0,0,0,0.5);">
            
            <!-- Видео -->
            <video src="{{ post.media.url }}" loop autoplay muted playsinline style="width: 100%; height: 100%; object-fit: cover; cursor: pointer;" onclick="togglePlay(this)"></video>

            <!-- Оверлей снизу (Автор и описание) -->
            <div style="position: absolute; bottom: 0; left: 0; right: 60px; padding: 20px 16px; background: linear-gradient(transparent, rgba(0,0,0,0.85)); z-index: 2; pointer-events: none;">
                <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 8px;">
                    <div style="width: 32px; height: 32px; border-radius: 50%; background: #262626; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; color: #fff; border: 1px solid rgba(255,255,255,0.2);">
                        {{ post.author.username|slice:":1"|upper }}
                    </div>
                    <span style="font-weight: 600; font-size: 14px; color: #fff;">{{ post.author.username }}</span>
                </div>
                {% if post.content %}
                    <p style="margin: 0; font-size: 13px; color: #e1e1e1; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">
                        {{ post.content }}
                    </p>
                {% endif %}
            </div>

            <!-- Правая панель действий (Лайк, Коммент, Поделиться) -->
            <div style="position: absolute; bottom: 20px; right: 12px; display: flex; flex-direction: column; gap: 20px; align-items: center; z-index: 3;">
                <button class="reel-action-btn" onclick="toggleLike(this)" style="background: none; border: none; color: #fff; font-size: 24px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px;">
                    <i class="fa-regular fa-heart"></i>
                </button>
                <button class="reel-action-btn" style="background: none; border: none; color: #fff; font-size: 22px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px;">
                    <i class="fa-regular fa-comment"></i>
                </button>
                <button class="reel-action-btn" style="background: none; border: none; color: #fff; font-size: 22px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px;">
                    <i class="fa-regular fa-paper-plane"></i>
                </button>
            </div>

        </div>
    {% empty %}
        <div style="text-align: center; color: var(--text-muted); padding: 80px 0;">
            <i class="fa-solid fa-film" style="font-size: 40px; margin-bottom: 12px; display: block;"></i>
            <p style="margin: 0; font-size: 15px;">Видео (Reels) пока нет.</p>
        </div>
    {% endfor %}
</div>

<script>
    // Пауза/Воспроизведение по клику на видео
    function togglePlay(video) {
        if (video.paused) {
            video.play();
        } else {
            video.pause();
        }
    }

    // Включение/выключение лайка
    function toggleLike(btn) {
        const icon = btn.querySelector('i');
        if (icon.classList.contains('fa-regular')) {
            icon.classList.remove('fa-regular');
            icon.classList.add('fa-solid');
            icon.style.color = '#ff3040';
        } else {
            icon.classList.remove('fa-solid');
            icon.classList.add('fa-regular');
            icon.style.color = '#ffffff';
        }
    }
</script>
{% endblock %}
