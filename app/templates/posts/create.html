{% extends 'posts/base.html' %}
{% block content %}
<style>.composer{max-width:720px;padding:20px;background:var(--surface);border:1px solid var(--border);border-radius:18px}.composer label{display:block;margin:0 0 8px;font-size:13px;color:var(--muted)}.composer select,.composer textarea,.composer input{width:100%;margin-bottom:16px;padding:12px;background:#111310;color:var(--text);border:1px solid var(--border);border-radius:11px;font:inherit}.composer textarea{min-height:180px;resize:vertical}.composer button{padding:11px 18px;background:var(--accent);color:#151710;border:0;border-radius:10px;font-weight:850;cursor:pointer}</style>
<form class="composer" method="post" enctype="multipart/form-data">{% csrf_token %}<label>Формат</label><select name="post_type"><option value="text">Ветка</option><option value="image">Фотография</option><option value="reels">Scene</option></select><label>Текст</label><textarea name="content" placeholder=""></textarea><label>Медиа</label><input type="file" name="media" accept="image/*,video/*"><button type="submit">Опубликовать</button></form>
{% endblock %}
