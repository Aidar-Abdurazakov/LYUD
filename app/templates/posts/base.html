<!DOCTYPE html>

<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LYUD</title>

    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Unbounded -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet"
    >

    <style>

        :root {

            --bg: #111210;
            --surface: #191b18;
            --surface-hover: #242723;
            --border: #30342e;
            --text: #f5f6f1;
            --muted: #999f94;
            --accent: #cbff50;
            --danger: #ff7272;

        }

        * {

            box-sizing: border-box;

        }

        body {

            margin: 0;

            min-height: 100vh;

            color: var(--text);

            background:
                radial-gradient(
                    circle at 50% -15%,
                    #293025 0%,
                    var(--bg) 40%
                ),
                var(--bg);

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

        }

        a {

            color: inherit;

        }


        /* =========================
           DESKTOP SIDEBAR
        ========================= */

        .desktop-sidebar {

            position: fixed;

            z-index: 20;

            inset: 0 auto 0 0;

            width: 244px;

            display: flex;

            flex-direction: column;

            padding: 28px 16px;

            background: rgba(18, 19, 17, 0.88);

            border-right:
                1px solid rgba(255, 255, 255, 0.08);

            backdrop-filter: blur(18px);

        }


        /* =========================
           LYUD BRAND
        ========================= */

        .brand {

            display: flex;

            align-items: center;

            gap: 12px;

            margin: 4px 13px 42px;

            color: var(--text);

            font-family: "Unbounded", sans-serif;

            font-size: 24px;

            font-weight: 700;

            letter-spacing: -1.5px;

            text-decoration: none;

        }


        /* =========================
           DESKTOP NAVIGATION
        ========================= */

        .desktop-nav {

            display: flex;

            flex-direction: column;

            gap: 5px;

        }

        .nav-item {

            display: flex;

            align-items: center;

            gap: 14px;

            padding: 13px 14px;

            color: #777c75;

            border: 1px solid transparent;

            border-radius: 13px;

            font-size: 14px;

            font-weight: 700;

            text-decoration: none;

            transition:
                color 0.2s ease,
                background 0.2s ease;

        }

        .nav-item:hover,

        .nav-item.active {

            color: #ffffff;

            background: rgba(255, 255, 255, 0.045);

            border-color:
                rgba(255, 255, 255, 0.05);

        }

        .nav-item:hover svg,

        .nav-item.active svg {

            filter:
                drop-shadow(
                    0 0 7px rgba(255, 255, 255, 0.55)
                );

        }


        /* =========================
           MOBILE ICONS
        ========================= */

        .mobile-icon {

            transition:
                color 0.2s ease,
                background 0.2s ease;

        }

        .mobile-icon:hover {

            color: #ffffff;

            background:
                rgba(255, 255, 255, 0.06);

        }

        .mobile-icon:hover svg {

            filter:
                drop-shadow(
                    0 0 7px rgba(255, 255, 255, 0.55)
                );

        }

        .nav-item svg {

            width: 21px;

            height: 21px;

        }


        /* =========================
           CREATE
        ========================= */

        .nav-create {

            margin-top: 10px;

            color: #777c75;

            background: transparent;

        }

        .nav-create:hover,

        .nav-create.active {

            color: #ffffff;

            background:
                rgba(255, 255, 255, 0.045);

        }

        .nav-create:hover svg,

        .nav-create.active svg {

            filter:
                drop-shadow(
                    0 0 7px rgba(255, 255, 255, 0.55)
                );

        }


        /* =========================
           SIDEBAR BOTTOM
        ========================= */

        .sidebar-bottom {

            margin-top: auto;

        }

        .sidebar-bottom .nav-item {

            color: var(--muted);

        }


        /* =========================
           MOBILE
        ========================= */

        .mobile-header,

        .mobile-nav {

            display: none;

        }


        /* =========================
           PAGE CONTENT
        ========================= */

        .page-content {

            width: min(100% - 48px, 760px);

            margin: 0 auto;

            padding: 36px 0 52px;

        }


        @media (min-width: 901px) {

            .page-content {

                margin-left:
                    max(
                        292px,
                        calc(50vw - 210px)
                    );

                margin-right: auto;

            }

        }


        /* =========================
           MOBILE RESPONSIVE
        ========================= */

        @media (max-width: 900px) {

            body {

                padding-bottom: 82px;

            }


            .desktop-sidebar {

                display: none;

            }


            .mobile-header {

                position: sticky;

                z-index: 20;

                top: 0;

                display: flex;

                align-items: center;

                justify-content: space-between;

                height: 62px;

                padding: 0 18px;

                background:
                    rgba(17, 18, 16, 0.9);

                border-bottom:
                    1px solid rgba(255, 255, 255, 0.08);

                backdrop-filter: blur(18px);

            }


            .mobile-brand {

                display: flex;

                align-items: center;

                gap: 10px;

                color: var(--text);

                font-family: "Unbounded", sans-serif;

                font-size: 19px;

                font-weight: 700;

                letter-spacing: -1px;

                text-decoration: none;

            }


            .mobile-actions {

                display: flex;

                gap: 8px;

            }


            .mobile-icon {

                width: 38px;

                height: 38px;

                display: grid;

                place-items: center;

                color: var(--text);

                border-radius: 10px;

            }


            .mobile-nav {

                position: fixed;

                z-index: 30;

                bottom: 12px;

                left: 50%;

                transform: translateX(-50%);

                display: flex;

                align-items: center;

                justify-content: center;

                gap: 4px;

                width: max-content;

                max-width: calc(100% - 20px);

                padding: 8px;

                background:
                    rgba(28, 30, 27, 0.94);

                border:
                    1px solid rgba(255, 255, 255, 0.12);

                border-radius: 17px;

                box-shadow:
                    0 20px 55px rgba(0, 0, 0, 0.45);

                backdrop-filter: blur(18px);

            }


            .mobile-nav .nav-item {

                width: 46px;

                height: 42px;

                display: grid;

                place-items: center;

                padding: 0;

            }


            .mobile-nav .nav-item span {

                display: none;

            }


            .mobile-nav .nav-create {

                color: #777c75;

                background: transparent;

            }


            .page-content {

                width:
                    min(100% - 20px, 760px);

                padding-top: 19px;

            }

        }

    </style>

</head>


<body>


    {% if user.is_authenticated %}


        <!-- =========================
             DESKTOP SIDEBAR
        ========================= -->

        <aside class="desktop-sidebar">


            <!-- BRAND -->

            <a
                href="{% url 'feed' %}"
                class="brand"
            >

                <svg
                    width="34"
                    height="34"
                    viewBox="0 0 120 120"
                    fill="none"
                    xmlns="http://www.w3.org/2000/svg"
                >

                    <rect
                        width="120"
                        height="120"
                        rx="28"
                        fill="#191B18"
                    />

                    <path
                        d="M42 32 C42 32, 42 78, 42 80
                           C42 85, 48 88, 54 84
                           C62 78, 78 52, 68 42
                           C58 32, 48 50, 72 78
                           C78 84, 88 82, 88 82"
                        stroke="url(#amber-grad-desktop)"
                        stroke-width="8"
                        stroke-linecap="round"
                    />

                    <defs>

                        <linearGradient
                            id="amber-grad-desktop"
                            x1="42"
                            y1="32"
                            x2="88"
                            y2="82"
                            gradientUnits="userSpaceOnUse"
                        >

                            <stop
                                stop-color="#FFB703"
                            />

                            <stop
                                offset="1"
                                stop-color="#FF007F"
                            />

                        </linearGradient>

                    </defs>

                </svg>

                <span>LYUD</span>

            </a>


            <!-- NAVIGATION -->

            <nav class="desktop-nav">


                <a
                    href="{% url 'feed' %}"
                    class="nav-item active"
                >

                    <i data-lucide="messages-square"></i>

                    <span>Ветки</span>

                </a>


                <a
                    href="{% url 'reels' %}"
                    class="nav-item"
                >

                    <i data-lucide="clapperboard"></i>

                    <span>Scenes</span>

                </a>


                <a
                    href="{% url 'create' %}"
                    class="nav-item nav-create"
                >

                    <i data-lucide="plus"></i>

                    <span>Поделиться</span>

                </a>


                <a
                    href="{% url 'notifications' %}"
                    class="nav-item"
                >

                    <i data-lucide="bell"></i>

                    <span>Активность</span>

                </a>


                <a
                    href="{% url 'direct' %}"
                    class="nav-item"
                >

                    <i data-lucide="message-circle"></i>

                    <span>Сообщения</span>

                </a>


                <a
                    href="{% url 'bookmarks' %}"
                    class="nav-item"
                >

                    <i data-lucide="bookmark"></i>

                    <span>Сохранённое</span>

                </a>


            </nav>


            <!-- BOTTOM -->

            <div class="sidebar-bottom">


                <a
                    href="{% url 'creator' %}"
                    class="nav-item"
                >

                    <i
                        data-lucide="chart-no-axes-combined"
                    ></i>

                    <span>LYUD Creator</span>

                </a>


                <a
                    href="{% url 'profile' %}"
                    class="nav-item"
                >

                    <i data-lucide="user-round"></i>

                    <span>Профиль</span>

                </a>


            </div>


        </aside>


        <!-- =========================
             MOBILE HEADER
        ========================= -->

        <header class="mobile-header">


            <a
                href="{% url 'feed' %}"
                class="mobile-brand"
            >

                <svg
                    width="28"
                    height="28"
                    viewBox="0 0 120 120"
                    fill="none"
                    xmlns="http://www.w3.org/2000/svg"
                >

                    <rect
                        width="120"
                        height="120"
                        rx="28"
                        fill="#191B18"
                    />

                    <path
                        d="M42 32 C42 32, 42 78, 42 80
                           C42 85, 48 88, 54 84
                           C62 78, 78 52, 68 42
                           C58 32, 48 50, 72 78
                           C78 84, 88 82, 88 82"
                        stroke="url(#amber-grad-mobile)"
                        stroke-width="8"
                        stroke-linecap="round"
                    />

                    <defs>

                        <linearGradient
                            id="amber-grad-mobile"
                            x1="42"
                            y1="32"
                            x2="88"
                            y2="82"
                            gradientUnits="userSpaceOnUse"
                        >

                            <stop
                                stop-color="#FFB703"
                            />

                            <stop
                                offset="1"
                                stop-color="#FF007F"
                            />

                        </linearGradient>

                    </defs>

                </svg>

                <span>LYUD</span>

            </a>


            <div class="mobile-actions">


                <a
                    href="{% url 'search' %}"
                    class="mobile-icon"
                    aria-label="Поиск"
                >

                    <i data-lucide="search"></i>

                </a>


                <a
                    href="{% url 'direct' %}"
                    class="mobile-icon"
                    aria-label="Сообщения"
                >

                    <i data-lucide="message-circle"></i>

                </a>


            </div>


        </header>


        <!-- =========================
             MOBILE NAVIGATION
        ========================= -->

        <nav class="mobile-nav">


            <a
                href="{% url 'feed' %}"
                class="nav-item active"
                aria-label="Ветки"
            >

                <i data-lucide="messages-square"></i>

                <span>Ветки</span>

            </a>


            <a
                href="{% url 'reels' %}"
                class="nav-item"
                aria-label="Scenes"
            >

                <i data-lucide="clapperboard"></i>

                <span>Scenes</span>

            </a>


            <a
                href="{% url 'create' %}"
                class="nav-item nav-create"
                aria-label="Поделиться"
            >

                <i data-lucide="plus"></i>

                <span>Поделиться</span>

            </a>


            <a
                href="{% url 'notifications' %}"
                class="nav-item"
                aria-label="Активность"
            >

                <i data-lucide="bell"></i>

                <span>Активность</span>

            </a>


            <a
                href="{% url 'profile' %}"
                class="nav-item"
                aria-label="Профиль"
            >

                <i data-lucide="user-round"></i>

                <span>Профиль</span>

            </a>


        </nav>


    {% else %}


        <!-- =========================
             GUEST HEADER
        ========================= -->

        <header
            class="mobile-header"
            style="display: flex;"
        >


            <a
                href="{% url 'feed' %}"
                class="mobile-brand"
            >

                <svg
                    width="28"
                    height="28"
                    viewBox="0 0 120 120"
                    fill="none"
                    xmlns="http://www.w3.org/2000/svg"
                >

                    <rect
                        width="120"
                        height="120"
                        rx="28"
                        fill="#191B18"
                    />

                    <path
                        d="M42 32 C42 32, 42 78, 42 80
                           C42 85, 48 88, 54 84
                           C62 78, 78 52, 68 42
                           C58 32, 48 50, 72 78
                           C78 84, 88 82, 88 82"
                        stroke="url(#amber-grad-guest)"
                        stroke-width="8"
                        stroke-linecap="round"
                    />

                    <defs>

                        <linearGradient
                            id="amber-grad-guest"
                            x1="42"
                            y1="32"
                            x2="88"
                            y2="82"
                            gradientUnits="userSpaceOnUse"
                        >

                            <stop
                                stop-color="#FFB703"
                            />

                            <stop
                                offset="1"
                                stop-color="#FF007F"
                            />

                        </linearGradient>

                    </defs>

                </svg>

                <span>LYUD</span>

            </a>


            <a
                href="{% url 'search' %}"
                class="mobile-icon"
                aria-label="Поиск"
            >

                <i data-lucide="search"></i>

            </a>


        </header>


    {% endif %}


    <!-- =========================
         MAIN CONTENT
    ========================= -->

    <main class="page-content">

        {% block content %}

        {% endblock %}

    </main>


    <!-- =========================
         LUCIDE
    ========================= -->

    <script>

        lucide.createIcons();

    </script>


</body>

</html>
