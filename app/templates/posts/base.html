<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LYUD | for people</title>
    <!-- Подключаем иконки FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #000000;
            --card-bg-color: #0d0d0d;
            --text-color: #ffffff;
            --text-muted: #8e8e8e;
            --border-color: #262626;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            padding-bottom: 70px; /* Отступ снизу, чтобы контент не перекрывался меню */
        }

        /* Шапка */
        header {
            position: sticky;
            top: 0;
            background-color: var(--bg-color);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }

        .logo {
            font-weight: 800;
            font-size: 20px;
            letter-spacing: 1px;
            text-decoration: none;
            color: #fff;
        }

        .subtitle {
            font-size: 11px;
            color: var(--text-muted);
            display: block;
            margin-top: -2px;
        }

        main {
            max-width: 600px;
            margin: 20px auto;
            padding: 0 15px;
        }

        /* Фиксированное нижнее меню */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 55px;
            background-color: var(--bg-color);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: center; /* Центрируем всю группу */
            align-items: center;
            gap: 32px;               /* Слегка уменьшили отступ, чтобы поместилось 6 иконок */
            z-index: 1000;
        }

        .nav-item {
            color: var(--text-color);
            font-size: 20px;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.2s ease;
        }

        .nav-item:hover {
            opacity: 0.7;
        }
    </style>
</head>
<body>

    <!-- Шапка сайта -->
    <header>
        <div>
            <a href="{% url 'feed' %}" class="logo">LYUD</a>
            <span class="subtitle">by Aidar Abdurazakov</span>
        </div>
        <div>
            <a href="{% url 'search' %}" class="nav-item"><i class="fa-solid fa-magnifying-glass"></i></a>
        </div>
    </header>

    <!-- Основной контент страницы -->
    <main>
        {% block content %}
        {% endblock %}
    </main>

    <!-- Нижняя панель навигации -->
    <nav class="bottom-nav">
        <a href="{% url 'feed' %}" class="nav-item" title="Лента">
            <i class="fa-solid fa-house"></i>
        </a>
        <a href="{% url 'reels' %}" class="nav-item" title="Reels">
            <i class="fa-solid fa-film"></i>
        </a>
        <a href="{% url 'create' %}" class="nav-item" title="Создать">
            <i class="fa-regular fa-square-plus"></i>
        </a>
        <a href="{% url 'notifications' %}" class="nav-item" title="Уведомления">
            <i class="fa-regular fa-heart"></i>
        </a>
        <a href="{% url 'direct' %}" class="nav-item" title="Сообщения">
            <i class="fa-regular fa-paper-plane"></i>
        </a>
        <a href="{% url 'profile' %}" class="nav-item" title="Профиль">
            <i class="fa-regular fa-user"></i>
        </a>
    </nav>

</body>
</html>
